services:
  backend:
    image: teaching-platform-backend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.8.8-eclipse-temurin-8}
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:8-jdk-jammy}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-teaching_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-tp_dev}
      DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      APP_UPLOAD_PATH: /app/uploads
      APP_SEED_TEST_DATA: ${APP_SEED_TEST_DATA:-false}
      AI_API_URL: ${AI_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen3-vl-plus}
      JUDGE0_API_URL: ${JUDGE0_API_URL:-https://ce.judge0.com}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_API_HOST: ${JUDGE0_API_HOST:-}
      JUDGE0_TIMEOUT_MS: ${JUDGE0_TIMEOUT_MS:-15000}
      JUDGE0_LOCAL_FALLBACK: ${JUDGE0_LOCAL_FALLBACK:-true}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: teaching-platform-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
