services:
  legacy-mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.40}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teaching_platform}
      MYSQL_USER: ${MYSQL_USER:-tp_dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: ${TZ:-Asia/Shanghai}
    ports: ["${LEGACY_MYSQL_PORT:-3307}:3306"]
    volumes:
      - legacy-mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  legacy-backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.8.8-eclipse-temurin-8}
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:8-jdk-jammy}
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://legacy-mysql:3306/${MYSQL_DATABASE:-teaching_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-tp_dev}
      DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      APP_UPLOAD_PATH: /app/uploads
      APP_SEED_TEST_DATA: ${APP_SEED_TEST_DATA:-false}
      AI_API_URL: ${AI_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen3-vl-plus}
      JUDGE0_API_URL: ${JUDGE0_API_URL:-https://ce.judge0.com}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_LOCAL_FALLBACK: ${JUDGE0_LOCAL_FALLBACK:-true}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      legacy-mysql: { condition: service_healthy }

  gateway:
    build:
      context: ./docker/gateway
      dockerfile: Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports: ["${UNIFIED_PORT:-3000}:80"]
    depends_on:
      legacy-backend: { condition: service_started }
      user-service: { condition: service_started }
      learning-service: { condition: service_started }
      assessment-service: { condition: service_started }

volumes:
  legacy-mysql-data:
