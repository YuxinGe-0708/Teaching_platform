services:
  legacy-backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.8.8-eclipse-temurin-8}
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:8-jdk-jammy}
    environment:
      SERVER_PORT: 8080
      BFF_ENABLED: "true"
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      USER_SERVICE_URL: http://user-service:8082
      LEARNING_SERVICE_URL: http://learning-service:8083
      ASSESSMENT_SERVICE_URL: http://assessment-service:8084
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      APP_UPLOAD_PATH: /app/uploads
      APP_SEED_TEST_DATA: ${APP_SEED_TEST_DATA:-false}
      AI_API_URL: ${AI_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen3-vl-plus}
      JUDGE0_API_URL: ${JUDGE0_API_URL:-https://ce.judge0.com}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_LOCAL_FALLBACK: ${JUDGE0_LOCAL_FALLBACK:-true}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./uploads:/app/uploads

  gateway:
    build:
      context: ./docker/gateway
      dockerfile: Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports: ["${UNIFIED_PORT:-3000}:80"]
    depends_on:
      legacy-backend: { condition: service_started }
      user-service: { condition: service_started }
      learning-service: { condition: service_started }
      assessment-service: { condition: service_started }
