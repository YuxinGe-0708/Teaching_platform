server:
  port: ${SERVER_PORT:8083}
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: learning-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learning_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,readiness
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: learning-service
    version: 1.0.0

app:
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  ai:
    api-url: ${AI_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen-plus}
    vision-model: ${AI_VISION_MODEL:qwen3-vl-plus}
