server:
  port: ${SERVER_PORT:8082}
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: user-service
  datasource:
    # user-service owns user_db and never reads another service's schema.
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,readiness
  endpoint:
    health:
      probes:
        enabled: true

# 版本信息（用于 /actuator/info 与 /api/version）
info:
  app:
    name: user-service
    version: 1.0.0

app:
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
  learning-service-url: ${LEARNING_SERVICE_URL:http://localhost:8083}
  jwt:
    # 至少 32 字节以上，用于 HMAC-SHA256；生产用环境变量覆盖
    secret: ${JWT_SECRET:ChangeMe_ThisIs_A_32BytePlus_SecretKey_ForHS256_XYZ}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
