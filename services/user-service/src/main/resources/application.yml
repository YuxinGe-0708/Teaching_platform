server:
  port: ${SERVER_PORT:8082}
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,readiness,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
    circuitbreakers:
      enabled: true
    circuitbreakerevents:
      enabled: true

info:
  app:
    name: user-service
    version: 1.0.0

app:
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
  learning-service-url: ${LEARNING_SERVICE_URL:http://localhost:8083}
  jwt:
    secret: ${JWT_SECRET:ChangeMe_ThisIs_A_32BytePlus_SecretKey_ForHS256_XYZ}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Resilience4j 熔断器配置
resilience4j:
  circuitbreaker:
    instances:
      learningService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 3