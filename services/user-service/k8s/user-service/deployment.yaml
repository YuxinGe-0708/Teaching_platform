apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: teaching-platform
  labels:
    app: user-service
spec:
  replicas: 1
  # Docker Desktop's single-node cluster cannot hold two Java replicas during
  # a rolling update. Recreate prevents a transient second JVM from being
  # OOM-killed while preserving the same steady-state service and HPA target.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: swr-registry
      containers:
        - name: user-service
          image: __SWR_REGISTRY__/__SWR_ORG__/teaching-platform-user-service:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teaching-platform-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              value: "ChangeMe_ThisIs_A_32BytePlus_SecretKey_ForHS256_XYZ"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: teaching-platform-secrets
                  key: INTERNAL_API_KEY
            - name: LEARNING_SERVICE_URL
              value: "http://learning-service:8083"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: teaching-platform
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
