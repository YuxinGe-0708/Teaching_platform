server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: assessment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/assessment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,readiness
  endpoint:
    health:
      probes:
        enabled: true
app:
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
  learning-service-url: ${LEARNING_SERVICE_URL:http://localhost:8083}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
  judge0:
    api-url: ${JUDGE0_API_URL:https://ce.judge0.com}
    api-key: ${JUDGE0_API_KEY:}
    api-host: ${JUDGE0_API_HOST:}
    timeout-ms: ${JUDGE0_TIMEOUT_MS:15000}
    local-fallback: ${JUDGE0_LOCAL_FALLBACK:true}
