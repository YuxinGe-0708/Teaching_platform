upstream legacy_backend { server legacy-backend:8080; }
upstream user_service { server user-service:8082; }
upstream learning_service { server learning-service:8083; }
upstream assessment_service { server assessment-service:8084; }

server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Public REST entry points. Authorization and X-User-* headers are kept.
    location /api/auth/ { proxy_pass http://user_service; include /etc/nginx/proxy_params; }
    location /api/profile { proxy_pass http://user_service; include /etc/nginx/proxy_params; }
    location /api/notifications { proxy_pass http://user_service; include /etc/nginx/proxy_params; }
    location /api/courses { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/classes { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/enrollments { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/resources { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/resource-progress { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/study-notes { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/discussions { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/v2/judge/ { proxy_pass http://assessment_service; include /etc/nginx/proxy_params; }

    # Existing Thymeleaf pages and legacy endpoints remain available.
    location / {
        proxy_pass http://legacy_backend;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
