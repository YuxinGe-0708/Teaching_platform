services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.43}
    container_name: teaching-platform-ci-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ci-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teaching_platform}
      MYSQL_USER: ${MYSQL_USER:-tp_ci}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ci-password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-ci-data:/var/lib/mysql
      - ./db/e2e-init/01_teaching_platform.sql:/docker-entrypoint-initdb.d/01_teaching_platform.sql:ro
      - ./db/init/01_schema.sql:/docker-entrypoint-initdb.d/core-schema.src:ro
      - ./db/init/02_test_data.sql:/docker-entrypoint-initdb.d/core-test-data.src:ro
      - ./services/user-service/src/main/resources/db/schema-user.sql:/docker-entrypoint-initdb.d/user-schema.src:ro
      - ./services/learning-service/src/main/resources/db/schema-learning.sql:/docker-entrypoint-initdb.d/learning-schema.src:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    image: teaching-platform-user-service:${IMAGE_TAG:-ci}
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.8.8-eclipse-temurin-8}
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:8-jdk-jammy}
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ci-root-password}
      JWT_SECRET: ${JWT_SECRET:-ChangeMe_ThisIs_A_32BytePlus_SecretKey_ForHS256_XYZ}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy

  learning-service:
    image: teaching-platform-learning-service:${IMAGE_TAG:-ci}
    build:
      context: ./services/learning-service
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.8.8-eclipse-temurin-8}
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:8-jdk-jammy}
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/learning_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ci-root-password}
      USER_SERVICE_URL: http://user-service:8082
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${LEARNING_SERVICE_PORT:-8083}:8083"
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_started

volumes:
  mysql-ci-data:
