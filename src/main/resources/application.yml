server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 1024MB

spring:
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:1024MB}
      max-request-size: ${MAX_REQUEST_SIZE:1024MB}

app:
  # This application is permanently a stateless page/BFF process.
  bff:
    enabled: ${BFF_ENABLED:true}
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
  services:
    user-url: ${USER_SERVICE_URL:http://localhost:8082}
    learning-url: ${LEARNING_SERVICE_URL:http://localhost:8083}
    assessment-url: ${ASSESSMENT_SERVICE_URL:http://localhost:8084}
  upload-path: ${APP_UPLOAD_PATH:./uploads}
