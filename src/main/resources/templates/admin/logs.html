<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志 - TeachingPlatform</title>
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="main-area">
        <header class="topbar"><h1>操作日志</h1></header>
        <section class="content">
            <table>
                <thead><tr><th>ID</th><th>时间</th><th>用户ID</th><th>用户名</th><th>操作</th><th>详情</th></tr></thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.id}">1</td>
                    <td th:text="${log.createdAt}">时间</td>
                    <td th:text="${log.userId}">1</td>
                    <td th:text="${log.username}">用户</td>
                    <td th:text="${log.action}">操作</td>
                    <td th:text="${log.detail}">详情</td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}"><td colspan="6">暂无操作日志。</td></tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
