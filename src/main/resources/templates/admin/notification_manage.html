<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告管理 - TeachingPlatform</title>
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="main-area">
        <header class="topbar"><h1>公告管理</h1></header>
        <section class="content">
            <div class="message success" th:if="${message == 'published'}">公告已发布。</div>
            <div class="message success" th:if="${message == 'deleted'}">公告记录已删除。</div>

            <div class="panel">
                <h2>发布公告</h2>
                <form action="/admin/notifications/publish" method="post" class="form">
                    <label for="title">标题</label>
                    <input id="title" name="title" maxlength="200" required>

                    <label for="content">内容</label>
                    <textarea id="content" name="content" rows="5" required></textarea>

                    <label for="type">类型</label>
                    <select id="type" name="type">
                        <option value="system">系统</option>
                        <option value="course">课程</option>
                        <option value="grade">成绩</option>
                    </select>

                    <label for="targetRole">接收范围</label>
                    <select id="targetRole" name="targetRole">
                        <option value="">全部用户</option>
                        <option value="student">仅学生</option>
                        <option value="teacher">仅教师</option>
                        <option value="admin">仅管理员</option>
                    </select>

                    <button type="submit" class="btn primary">发布</button>
                </form>
            </div>

            <h2>最近公告记录</h2>
            <table>
                <thead><tr><th>ID</th><th>用户ID</th><th>标题</th><th>类型</th><th>已读</th><th>时间</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="n : ${notifications}">
                    <td th:text="${n.id}">1</td>
                    <td th:text="${n.userId}">1</td>
                    <td th:text="${n.title}">标题</td>
                    <td th:text="${n.type}">system</td>
                    <td th:text="${n.isRead ? '是' : '否'}">否</td>
                    <td th:text="${n.createdAt}">时间</td>
                    <td>
                        <form action="/admin/notifications/delete" method="post" onsubmit="return confirm('确定删除这条通知记录吗？')">
                            <input type="hidden" name="notificationId" th:value="${n.id}">
                            <button type="submit" class="btn danger">删除</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(notifications)}"><td colspan="7">暂无公告记录。</td></tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
