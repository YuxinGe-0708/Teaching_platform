<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试须知 - TeachingPlatform</title>
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="main-area">
        <header class="topbar">
            <h1 th:text="'考试：' + ${task.title}">考试</h1>
            <a class="btn" th:href="${course != null ? '/student/course/detail/' + course.courseId : '/student/tasks?type=exam'}">返回课程</a>
        </header>
        <section class="content">
            <div class="message error" th:if="${error}" th:text="${error}"></div>

            <div class="panel" th:if="${error == null}">
                <h2>考试信息</h2>
                <div class="score-metrics">
                    <div><span>考试名称</span><strong th:text="${task.title}">考试名称</strong></div>
                    <div><span>所属课程</span><strong th:text="${course != null ? course.courseName : '-'}">课程</strong></div>
                    <div><span>满分</span><strong th:text="${task.fullScore}">100</strong></div>
                    <div><span>截止时间</span><strong th:text="${task.endTime != null ? #dates.format(task.endTime, 'yyyy-MM-dd HH:mm') : '不限'}">不限</strong></div>
                </div>
                <div class="task-content" th:if="${taskContentHtml != null && taskContentHtml != ''}" th:utext="${taskContentHtml}"></div>
            </div>

            <div class="panel" th:if="${error == null && (record == null || record.notStarted)}">
                <h2>考试须知</h2>
                <ol>
                    <li>请在规定时间内独立完成考试。</li>
                    <li>作答过程会自动暂存，仍建议提交前确认所有题目都已填写。</li>
                    <li>如题目要求附件，请在交卷前上传；教师可下载附件并人工评分。</li>
                    <li>提交后不可再次修改答案。</li>
                </ol>
                <form th:action="@{/student/exam/begin}" method="post">
                    <input type="hidden" name="taskId" th:value="${task.taskId}">
                    <button type="submit" class="primary">开始考试</button>
                </form>
            </div>

            <div class="panel" th:if="${error == null && record != null && record.inProgress}">
                <h2>考试进行中</h2>
                <p class="muted">你已经开始本次考试，可以继续作答。</p>
                <a class="btn primary" th:href="@{/student/exam/take(taskId=${task.taskId})}">继续考试</a>
            </div>

            <div class="panel" th:if="${error == null && record != null && record.submitted}">
                <h2>考试已提交</h2>
                <p>提交状态：<span class="status-badge" th:text="${record.status == 'AUTO_SUBMITTED' ? '超时自动交卷' : '已交卷'}"></span></p>
                <p th:if="${record.submitTime != null}">交卷时间：<span th:text="${#dates.format(record.submitTime, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                <p th:if="${record.score != null}">得分：<span th:text="${record.score}"></span></p>
            </div>
        </section>
    </main>
</div>
</body>
</html>
