<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理 - TeachingPlatform</title>
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="main-area">
        <header class="topbar"><h1 th:text="'班级管理 - ' + ${course.courseName}">班级管理</h1><a class="btn" href="/teacher/course/manage">返回</a></header>
        <section class="content">
            <div class="panel">
                <form action="/teacher/course/class/create" method="post" class="form-inline">
                    <input type="hidden" name="courseId" th:value="${course.courseId}">
                    <div><label for="className">班级名称</label><input id="className" type="text" name="className" required></div>
                    <div><label for="maxCount">人数上限</label><input id="maxCount" type="number" name="maxCount" value="100" min="1"></div>
                    <button type="submit" class="btn primary">创建班级</button>
                </form>
            </div>
            <table>
                <thead><tr><th>班级名称</th><th>邀请码</th><th>人数</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="cls : ${classes}">
                    <td>
                        <form action="/teacher/course/class/update" method="post" class="form-inline">
                            <input type="hidden" name="courseId" th:value="${course.courseId}">
                            <input type="hidden" name="classId" th:value="${cls.classId}">
                            <input name="className" th:value="${cls.className}" required>
                            <input name="maxCount" type="number" min="1" th:value="${cls.maxCount}">
                            <button type="submit" class="btn">保存</button>
                        </form>
                    </td>
                    <td><strong th:text="${cls.inviteCode}">CODE</strong></td>
                    <td th:text="${cls.currentCount} + ' / ' + ${cls.maxCount}">0 / 100</td>
                    <td><a class="btn danger" th:href="@{/teacher/course/class/delete(courseId=${course.courseId}, classId=${cls.classId})}" onclick="return confirm('确定删除该班级吗？')">删除</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(classes)}"><td colspan="4">暂无班级。</td></tr>
                </tbody>
            </table>
            <div class="panel">
                <h2>班级成员</h2>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>学生</th><th>用户名</th><th>班级</th><th>加入时间</th><th>在线学习时长</th><th>操作</th></tr></thead>
                        <tbody>
                        <tr th:each="member : ${members}">
                            <td th:text="${member.studentName}">学生</td>
                            <td th:text="${member.username}">username</td>
                            <td th:text="${member.className}">班级</td>
                            <td th:text="${member.joinedAt == null ? '-' : #dates.format(member.joinedAt, 'yyyy-MM-dd HH:mm')}">加入时间</td>
                            <td th:text="${member.onlineMinutes} + ' 分钟'">0 分钟</td>
                            <td>
                                <form action="/teacher/course/class/remove-student" method="post" onsubmit="return confirm('确定将该学生移出课程吗？')">
                                    <input type="hidden" name="courseId" th:value="${course.courseId}">
                                    <input type="hidden" name="studentId" th:value="${member.studentId}">
                                    <button type="submit" class="btn danger">移除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(members)}"><td colspan="6">暂无学生加入。</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
