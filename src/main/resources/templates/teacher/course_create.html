<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建课程 - TeachingPlatform</title>
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="main-area">
        <header class="topbar"><h1>创建课程</h1><a class="btn" href="/teacher/course/manage">返回</a></header>
        <section class="content">
            <div class="panel">
                <form action="/teacher/course/create" method="post" class="form">
                    <label for="courseName">课程名称</label>
                    <input id="courseName" type="text" name="courseName" required>
                    <label for="courseCode">课程编号</label>
                    <input id="courseCode" type="text" name="courseCode" required>
                    <label for="subjectCategory">学科分类</label>
                    <input id="subjectCategory" type="text" name="subjectCategory" placeholder="例如：计算机 / 数学 / 外语">
                    <label for="credit">学分</label>
                    <input id="credit" type="number" name="credit" step="0.5" value="2" required>
                    <label for="hours">学时</label>
                    <input id="hours" type="number" name="hours" min="0" value="32">
                    <label for="status">课程状态</label>
                    <select id="status" name="status">
                        <option value="active">进行中</option>
                        <option value="draft">草稿</option>
                        <option value="closed">已结课</option>
                    </select>
                    <label class="check-row"><input type="checkbox" name="allowJoin" value="true" checked> 允许学生自主加入</label>
                    <label for="description">课程简介</label>
                    <textarea id="description" name="description"></textarea>
                    <button type="submit">创建</button>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
