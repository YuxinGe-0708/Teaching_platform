<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业管理 - TeachingPlatform</title>
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="main-area">
        <header class="topbar"><h1>作业与考试管理</h1><a class="btn primary" href="/teacher/task/create">发布任务</a></header>
        <section class="content">
            <table>
                <thead><tr><th>标题</th><th>课程</th><th>类型</th><th>满分</th><th>状态</th><th>生命周期</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="t : ${tasks}">
                    <td th:text="${t.title}">任务标题</td>
                    <td><span th:each="c : ${courses}" th:if="${c.courseId == t.courseId}" th:text="${c.courseName}"></span></td>
                    <td><span class="status-badge" th:text="${t.taskType}">类型</span></td>
                    <td th:text="${t.fullScore}">100</td>
                    <td th:text="${t.status}">已发布</td>
                    <td>
                        <form action="/teacher/task/status" method="post" class="form-inline">
                            <input type="hidden" name="taskId" th:value="${t.taskId}">
                            <select name="status">
                                <option value="published">发布</option>
                                <option value="draft">草稿</option>
                                <option value="closed">关闭</option>
                                <option value="expired">过期</option>
                                <option value="retracted">撤回</option>
                            </select>
                            <input type="datetime-local" name="endTime">
                            <button type="submit" class="btn">更新</button>
                        </form>
                    </td>
                    <td>
                        <a class="btn" th:href="@{/teacher/task/detail/{taskId}(taskId=${t.taskId})}">查看/批改</a>
                        <a class="btn danger" th:href="@{/teacher/task/delete(taskId=${t.taskId})}" onclick="return confirm('确定撤回该任务吗？')">撤回</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tasks)}"><td colspan="7">暂无任务。</td></tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
