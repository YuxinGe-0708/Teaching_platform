<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务详情 - TeachingPlatform</title>
    <link rel="stylesheet" th:href="@{/css/cyberpunk.css}">
</head>
<body>
<div class="app-layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="main-area">
        <header class="topbar"><h1 th:text="${task.title}">任务详情</h1><a class="btn" href="/teacher/task/manage">返回</a></header>
        <section class="content">
            <div class="panel">
                <span class="status-badge" th:text="${task.taskType}">实验作业</span>
                <p class="muted">满分：<span th:text="${task.fullScore}"></span> ｜ 状态：<span th:text="${task.status}"></span></p>
                <div class="task-content" th:if="${taskContentHtml != null && taskContentHtml != ''}" th:utext="${taskContentHtml}">任务内容</div>
            </div>

            <div class="panel" th:if="${examRecords != null}">
                <h2>考试记录</h2>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>学生</th><th>考试状态</th><th>开始时间</th><th>交卷时间</th><th>得分</th><th>提交摘要</th></tr></thead>
                        <tbody>
                        <tr th:each="er : ${examRecords}">
                            <td th:text="${er.studentName != null ? er.studentName : '学生ID:' + er.studentId}">学生</td>
                            <td><span class="status-badge" th:text="${er.status}">状态</span></td>
                            <td th:text="${er.startTime != null ? #dates.format(er.startTime, 'yyyy-MM-dd HH:mm:ss') : '-'}">开始时间</td>
                            <td th:text="${er.submitTime != null ? #dates.format(er.submitTime, 'yyyy-MM-dd HH:mm:ss') : '-'}">交卷时间</td>
                            <td th:text="${er.score != null ? er.score + ' 分' : '未评分'}">得分</td>
                            <td th:text="${er.content != null && er.content.length() > 80 ? er.content.substring(0, 80) + '...' : er.content}">内容</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(examRecords)}"><td colspan="6">暂无考试记录。</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="panel">
                <h2 th:text="${examRecords != null ? '交卷与批改' : '提交与批改'}">提交与批改</h2>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>学生</th><th>提交时间</th><th>状态</th><th>得分</th><th>评测</th><th>附件</th><th>操作</th></tr></thead>
                        <tbody>
                        <tr th:each="sub : ${submissions}">
                            <td th:text="${sub.studentName != null ? sub.studentName : '学生ID:' + sub.studentId}">学生</td>
                            <td th:text="${#dates.format(sub.submitTime, 'yyyy-MM-dd HH:mm')}">提交时间</td>
                            <td><span class="status-badge" th:text="${sub.submitStatus}">状态</span></td>
                            <td th:text="${sub.score != null ? sub.score + ' 分' : '未批改'}">得分</td>
                            <td th:text="${sub.judgeStatus}">评测</td>
                            <td>
                                <a th:if="${sub.fileUrl != null}" class="btn" th:href="@{/teacher/task/download(filePath=${sub.fileUrl})}">下载</a>
                                <span th:if="${sub.fileUrl == null && examAttachmentCounts != null && examAttachmentCounts[sub.submissionId] != null && examAttachmentCounts[sub.submissionId] > 0}"
                                      th:text="${examAttachmentCounts[sub.submissionId]} + ' 个附件，进入批改页下载'">进入批改页下载</span>
                                <span th:if="${sub.fileUrl == null && (examAttachmentCounts == null || examAttachmentCounts[sub.submissionId] == null || examAttachmentCounts[sub.submissionId] == 0)}">-</span>
                            </td>
                            <td><a class="btn primary" th:href="@{/teacher/task/grade/{submissionId}(submissionId=${sub.submissionId})}">批改</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(submissions)}"><td colspan="7">暂无提交。</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
