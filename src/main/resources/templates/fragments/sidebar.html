<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar">
    <div class="sidebar-brand">TeachingPlatform</div>
    <nav class="sidebar-nav">
        <a href="/home">主页</a>
        <th:block th:if="${currentUser != null and currentUser.role == 'student'}">
            <a href="/student/course/my">我的课程</a>
            <a href="/student/course/selection">选课中心</a>
            <a href="/student/classes">班级管理</a>
            <a href="/student/tasks">作业考试</a>
            <a href="/student/notes">随堂笔记</a>
            <a href="/student/scores">成绩汇总</a>
            <a href="/student/logs">选课记录</a>
            <a href="/notifications">我的公告</a>
            <a href="/student/ai">AI 答疑</a>
        </th:block>
        <th:block th:if="${currentUser != null and currentUser.role == 'teacher'}">
            <a href="/teacher/course/manage">课程管理</a>
            <a href="/teacher/task/manage">作业管理</a>
            <a href="/teacher/score/statistics">成绩统计</a>
            <a href="/notifications">我的公告</a>
            <a href="/teacher/ai">AI 答疑</a>
        </th:block>
        <th:block th:if="${currentUser != null and currentUser.role == 'admin'}">
            <a href="/admin/dashboard">管理首页</a>
            <a href="/admin/users">用户管理</a>
            <a href="/admin/notifications">公告管理</a>
            <a href="/admin/logs">系统日志</a>
        </th:block>
    </nav>
    <div class="sidebar-user">
        <strong th:if="${currentUser != null}">你好，<span th:text="${currentUser.username}">user</span></strong>
        <a th:if="${currentUser != null}" class="btn" href="/profile">个人信息</a>
        <a th:if="${currentUser != null}" class="btn danger" href="/logout">退出</a>
        <a th:if="${currentUser == null}" class="btn" href="/login">登录</a>
    </div>
</aside>
</body>
</html>
