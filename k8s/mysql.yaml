apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: teaching-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: teaching-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.43
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: teaching-platform-secrets, key: MYSQL_ROOT_PASSWORD } }
            - name: MYSQL_DATABASE
              valueFrom: { configMapKeyRef: { name: teaching-platform-config, key: MYSQL_DATABASE } }
            - name: MYSQL_USER
              valueFrom: { configMapKeyRef: { name: teaching-platform-config, key: MYSQL_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: teaching-platform-secrets, key: MYSQL_PASSWORD } }
            - name: TZ
              value: Asia/Shanghai
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init-sql, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: migrations, mountPath: /opt/db-migrations, readOnly: true }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-data }
        - name: init-sql
          configMap: { name: teaching-platform-db-init }
        - name: migrations
          configMap: { name: teaching-platform-db-migrations }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: teaching-platform
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
