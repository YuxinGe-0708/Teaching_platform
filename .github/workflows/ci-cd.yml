name: Teaching Platform CI/CD

on:
  pull_request:
    branches: [dev_dockerfile, dev, main, master]
  push:
    branches: [dev_dockerfile, codex/dev-dockerfile-work]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: teaching-platform-ci
  IMAGE_TAG: ${{ github.sha }}
  MYSQL_ROOT_PASSWORD: ci-root-password
  MYSQL_DATABASE: teaching_platform
  MYSQL_USER: tp_ci
  MYSQL_PASSWORD: ci-password
  APP_SEED_TEST_DATA: 'true'
  FRONTEND_PORT: '3000'
  BACKEND_PORT: '8081'
  AI_API_URL: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  AI_API_KEY: ${{ secrets.AI_API_KEY }}
  AI_MODEL: qwen-plus
  AI_VISION_MODEL: qwen3-vl-plus

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Unit tests
        run: mvn -B test
      - name: Build application containers
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml build
      - name: Start integration environment
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
      - name: Wait for frontend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:3000/healthz | grep -qx 'ok'; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.app.yml ps
          exit 1
      - name: Container smoke test
        shell: pwsh
        run: ./scripts/container-smoke.ps1 -BaseUrl http://localhost:3000 -BackendUrl http://localhost:8081
      - name: Business integration regression
        shell: pwsh
        run: ./scripts/container-business-regression.ps1 -BaseUrl http://localhost:3000
      - name: Qwen AI integration smoke test
        if: env.AI_API_KEY != ''
        shell: pwsh
        run: ./scripts/container-ai-smoke.ps1 -BaseUrl http://localhost:3000
      - name: Collect integration logs
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          docker compose -f docker-compose.yml -f docker-compose.app.yml ps > ci-artifacts/compose-ps.txt || true
          docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color > ci-artifacts/compose.log || true
      - name: Upload test and runtime records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-records-${{ github.run_id }}
          path: |
            ci-artifacts/
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop integration environment
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml down -v --remove-orphans

  publish:
    name: Publish versioned images
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev_dockerfile' || github.ref == 'refs/heads/codex/dev-dockerfile-work' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select image version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="sha-${GITHUB_SHA::12}"; fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p publish-records
          printf 'commit=%s\nref=%s\nimage_tag=%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$tag" > publish-records/metadata.txt
      - name: Log in to Huawei Cloud SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          build-args: |
            MAVEN_IMAGE=${{ vars.MAVEN_IMAGE || 'maven:3.8.8-eclipse-temurin-8' }}
            JAVA_IMAGE=${{ vars.JAVA_IMAGE || 'eclipse-temurin:8-jdk-jammy' }}
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-backend:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: docker/frontend
          file: docker/frontend/Dockerfile
          push: true
          build-args: |
            NGINX_IMAGE=${{ vars.NGINX_IMAGE || 'nginx:1.27-alpine' }}
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-frontend:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Upload publish records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-records-${{ github.run_id }}
          path: publish-records/
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    name: Deploy to Kubernetes
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev_dockerfile' || github.ref == 'refs/heads/codex/dev-dockerfile-work' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Install deployment tooling
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Configure Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' '${{ secrets.KUBE_CONFIG_B64 }}' | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Deploy immutable image version
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          SWR_REGISTRY: ${{ secrets.SWR_REGISTRY }}
          SWR_ORG: ${{ secrets.SWR_ORG }}
          SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: bash scripts/k8s-deploy.sh
      - name: Upload deployment records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-records-${{ github.run_id }}
          path: deploy-artifacts/
          if-no-files-found: ignore
          retention-days: 30
