name: Teaching Platform CI/CD

on:
  pull_request:
    branches: [dev_dockerfile, dev, main, master]
  push:
    branches: [dev_dockerfile, codex/dev-dockerfile-work]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: teaching-platform-ci
  IMAGE_TAG: ${{ github.sha }}
  MICROSERVICES_DB_ROOT_PASSWORD: ci-root-password
  INTERNAL_API_KEY: ci-internal-api-key
  UNIFIED_PORT: '3000'
  AI_API_URL: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  AI_API_KEY: ${{ secrets.AI_API_KEY }}
  AI_MODEL: qwen-plus
  AI_VISION_MODEL: qwen3-vl-plus
  JUDGE0_API_URL: http://127.0.0.1:9
  JUDGE0_TIMEOUT_MS: '1000'
  JUDGE0_LOCAL_FALLBACK: 'true'

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install E2E dependencies
        run: python -m pip install -r tests/e2e/requirements.txt
      - name: Verify every public backend API has an automated test
        shell: pwsh
        run: ./scripts/verify-public-api-coverage.ps1
      - name: Build and test stateless web BFF
        run: mvn -B test package
      - name: Build and test user-service
        working-directory: services/user-service
        run: mvn -B test package
      - name: Build and test learning-service
        working-directory: services/learning-service
        run: mvn -B test package
      - name: Build and test assessment-service
        working-directory: services/assessment-service
        run: mvn -B test package
      - name: Upload user-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: user-service-jar-${{ github.run_id }}
          path: services/user-service/target/user-service.jar
          if-no-files-found: error
          retention-days: 2
      - name: Upload learning-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: learning-service-jar-${{ github.run_id }}
          path: services/learning-service/target/learning-service.jar
          if-no-files-found: error
          retention-days: 2
      - name: Upload assessment-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: assessment-service-jar-${{ github.run_id }}
          path: services/assessment-service/target/assessment-service.jar
          if-no-files-found: error
          retention-days: 2
      - name: Build microservice application containers
        run: docker compose -f docker-compose.microservices.yml -f docker-compose.unified.yml build
      - name: Prepare integration upload storage
        run: |
          mkdir -p uploads
          chmod -R a+rwX uploads
      - name: Start integration environment
        shell: bash
        run: |
          set +e
          docker compose -f docker-compose.microservices.yml -f docker-compose.unified.yml up -d
          UP_STATUS=$?
          if [ $UP_STATUS -ne 0 ]; then
            echo "========================================================"
            echo "❌ 容器启动失败！打印所有容器日志以定位问题："
            echo "========================================================"
            docker compose -f docker-compose.microservices.yml -f docker-compose.unified.yml logs --no-color
            echo "========================================================"
            exit $UP_STATUS
          fi
      - name: Wait for frontend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:3000/healthz | grep -qx 'ok'; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.microservices.yml -f docker-compose.unified.yml ps
          exit 1
      - name: Container smoke test
        shell: pwsh
        run: ./scripts/microservices-smoke.ps1 -BaseUrl http://localhost:3000
      - name: Microservice E2E baseline
        shell: pwsh
        run: ./scripts/e2e-microservices.ps1 -UserUrl http://localhost:8082 -LearningUrl http://localhost:8083 -AssessmentUrl http://localhost:8084
      - name: Microservice business integration regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          try {
            ./scripts/microservices-business-regression.ps1 -BaseUrl http://localhost:3000 *>&1 | Tee-Object ci-artifacts/business-regression.log
          } catch {
            $_ | Out-String | Tee-Object -Append ci-artifacts/business-regression.log
            throw
          }
      - name: Qwen AI integration smoke test
        if: env.AI_API_KEY != ''
        shell: pwsh
        run: ./scripts/container-ai-smoke.ps1 -BaseUrl http://localhost:3000
      - name: Collect integration logs
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          docker compose -f docker-compose.microservices.yml -f docker-compose.unified.yml ps > ci-artifacts/compose-ps.txt || true
          docker compose -f docker-compose.microservices.yml -f docker-compose.unified.yml logs --no-color > ci-artifacts/compose.log || true
      - name: Upload test and runtime records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-records-${{ github.run_id }}
          path: |
            ci-artifacts/
            target/surefire-reports/
            services/user-service/target/surefire-reports/
            services/learning-service/target/surefire-reports/
            services/assessment-service/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop integration environment
        if: always()
        run: docker compose -f docker-compose.microservices.yml -f docker-compose.unified.yml down -v --remove-orphans

  publish:
    name: Publish versioned images
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev_dockerfile' || github.ref == 'refs/heads/codex/dev-dockerfile-work' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select image version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="sha-${GITHUB_SHA::12}"; fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p publish-records
          printf 'commit=%s\nref=%s\nimage_tag=%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$tag" > publish-records/metadata.txt
      - name: Log in to Huawei Cloud SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Download user-service JAR
        uses: actions/download-artifact@v4
        with:
          name: user-service-jar-${{ github.run_id }}
          path: services/user-service/target
      - name: Download learning-service JAR
        uses: actions/download-artifact@v4
        with:
          name: learning-service-jar-${{ github.run_id }}
          path: services/learning-service/target
      - name: Download assessment-service JAR
        uses: actions/download-artifact@v4
        with:
          name: assessment-service-jar-${{ github.run_id }}
          path: services/assessment-service/target
      - name: Build and push web BFF image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            MAVEN_IMAGE=${{ vars.MAVEN_IMAGE || 'maven:3.8.8-eclipse-temurin-8' }}
            JAVA_IMAGE=${{ vars.JAVA_IMAGE || 'eclipse-temurin:8-jdk-jammy' }}
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-web-bff:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-web-bff:sha-${{ github.sha }}
          cache-from: type=gha,scope=web-bff
          cache-to: type=gha,mode=max,scope=web-bff
      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: docker/gateway
          file: docker/gateway/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            NGINX_IMAGE=${{ vars.NGINX_IMAGE || 'nginx:1.27-alpine' }}
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-gateway:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-gateway:sha-${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Build and push user-service image
        uses: docker/build-push-action@v6
        with:
          context: services/user-service
          file: services/user-service/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-user-service:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-user-service:sha-${{ github.sha }}
      - name: Build and push learning-service image
        uses: docker/build-push-action@v6
        with:
          context: services/learning-service
          file: services/learning-service/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-learning-service:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-learning-service:sha-${{ github.sha }}
      - name: Build and push assessment-service image
        uses: docker/build-push-action@v6
        with:
          context: services/assessment-service
          file: services/assessment-service/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-assessment-service:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/teaching-platform-assessment-service:sha-${{ github.sha }}
      - name: Upload publish records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-records-${{ github.run_id }}
          path: publish-records/
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    name: Deploy to ephemeral kind Kubernetes
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev_dockerfile' || github.ref == 'refs/heads/codex/dev-dockerfile-work' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Create ephemeral Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: teaching-platform-demo
          config: k8s/kind-config.yaml
          wait: 120s
      - name: Install deployment tooling
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Deploy immutable image version
        shell: bash
        env:
          DEPLOY_TARGET: kind
          KIND_CLUSTER_NAME: teaching-platform-demo
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          SWR_REGISTRY: ${{ secrets.SWR_REGISTRY }}
          SWR_ORG: ${{ secrets.SWR_ORG }}
          SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
          DB_ROOT_PASSWORD: kind-demo-root-password
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: bash scripts/k8s-deploy.sh
      - name: Write Kubernetes demonstration summary
        if: success()
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          {
            echo "## Ephemeral Kubernetes deployment passed"
            echo
            echo "- Cluster: kind / teaching-platform-demo"
            echo "- Namespace: teaching-platform"
            echo "- Image version: \`$IMAGE_TAG\`"
            echo "- Health endpoint: \`/healthz = ok\`"
            echo "- Login and session smoke test: passed"
            echo "- Lifetime: this workflow job only"
            echo
            echo '```text'
            kubectl -n teaching-platform get deployments,pods,services,pvc -o wide
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deployment records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-records-${{ github.run_id }}
          path: deploy-artifacts/
          if-no-files-found: ignore
          retention-days: 30
